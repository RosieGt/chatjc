<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de SMS</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4 text-center" style="width: 100%; max-width: 400px; border-radius: 15px;">
        <div class="mb-3">
            <span class="fs-1"><i class="fas fa-envelope"></i></span>
            <h3 class="fw-bold text-primary mt-2">Confirme seu Email</h3>
            <p class="text-muted small">Enviamos um código de 4 dígitos para o email <strong>{{ telefone }}</strong></p>
        </div>

        <form action="/registro" method="POST">
            <input type="hidden" name="etapa" value="2">
            
            <div class="mb-4">
                <input type="text" class="form-control text-center fs-3 rounded-pill" name="codigo" maxlength="4" required placeholder="0000" autocomplete="off" style="letter-spacing: 8px;">
            </div>

            <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold">Verificar e Concluir</button>
        </form>

        <div class="mt-3">
            <small class="text-muted">Não recebeu o código? <a href="{{ url_for('registro') }}" class="text-decoration-none">Tentar novamente</a></small>
        </div>
    </div>

</body>
</html>
