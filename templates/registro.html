<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno - Chat Escola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4 border-0">
                    <h3 class="text-primary mb-3 text-center">Criar Conta de Aluno</h3>
                    
                    <form action="/registro" method="POST">
                        <input type="hidden" name="etapa" value="1">
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control rounded-pill px-3" id="nome" name="nome" required placeholder="Seu nome">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control rounded-pill px-3" id="email" name="email" required placeholder="seu@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="telefone" class="form-label">WhatsApp / Telefone</label>
                            <input type="tel" class="form-control rounded-pill px-3" id="telefone" name="telefone" required placeholder="(99) 99999-9999">
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control rounded-pill px-3" id="senha" name="senha" required placeholder="Sua senha">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mt-2">Avançar e Enviar Código</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="/" class="text-decoration-none">Já tem uma conta? Entrar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
